name: Metrics

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Create assets directory
        run: mkdir -p assets

      - name: Generate isocalendar metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: "UTC"
          filename: assets/isocalendar-metrics.svg

      - name: Generate WakaTime metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_sections: time, projects, languages, editors, os, categories
          filename: assets/wakatime-metrics.svg

      - name: Generate repository metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          repositories: ottojonas/ottos-bible
          config_display: repository
          filename: assets/repository-metrics.svg

      - name: Check if repository metrics file exists
        id: check_file
        run: |
          if [ -f assets/repository-metrics.svg ]; then
            echo "File exists"
            echo "::set-output name=file_exists::true"
          else
            echo "File does not exist"
            echo "::set-output name=file_exists::false"
          fi

      - name: Commit and push changes
        if: steps.check_file.outputs.file_exists == 'true'
        run: |
          git add assets/isocalendar-metrics.svg assets/wakatime-metrics.svg assets/repository-metrics.svg
          git commit -m 'Update GitHub metrics'
          git push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Commit and push changes without repository metrics
        if: steps.check_file.outputs.file_exists == 'false'
        run: |
          git add assets/isocalendar-metrics.svg assets/wakatime-metrics.svg
          git commit -m 'Update GitHub metrics (without repository metrics)'
          git push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
